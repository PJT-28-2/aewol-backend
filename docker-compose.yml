version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: aewol-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${DB_NAME:-aewol}
      MYSQL_USER: ${DB_USERNAME:-aewol}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aewol1234}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # MySQL은 접속 핸드셰이크에서 클라이언트가 요청한 문자셋을 그대로 받아준다.
      # 그래서 문자셋을 지정하지 않은 DB 클라이언트로 붙으면 세션이 latin1로 떨어져
      # 한글이 깨져 보이고, 그 상태로 INSERT하면 '?'로 저장되어 되돌릴 수 없다.
      #
      # 8.0에서 쓰던 --skip-character-set-client-handshake는 8.4에서 제거됐다.
      # 대신 접속 직후 실행되는 init_connect로 세션 문자셋을 다시 덮어쓴다.
      # (SUPER/CONNECTION_ADMIN 권한 계정에는 적용되지 않으므로 root 접속은 예외다.)
      - --init-connect=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: aewol-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  ocr-service:
    build: ./ocr-service
    container_name: aewol-ocr-service
    restart: unless-stopped
    ports:
      - "${OCR_SERVICE_PORT:-8000}:8000"

  # 메트릭을 눈으로 보기 위한 로컬 전용 구성.
  #
  # 지금까지는 성능 문제를 의심한 뒤에야 측정 도구를 따로 만들었다(#330 EXPLAIN 수동 실행,
  # #338 재현 스크립트 작성, #340 대기 시간 측정 프로그램). 상시로 보이면 그럴 필요가 없다.
  #
  # 프로파일로 묶어 두어 평소 `docker compose up`에는 딸려오지 않는다.
  #   docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aewol-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      # 로컬 메트릭과 설정을 같은 네트워크의 다른 기기에 노출하지 않는다.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aewol-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      # 로컬호스트 전용이라 익명 접근을 연다. 다른 환경에 복사하거나 재사용하지 않는다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
