# 로컬에서 메트릭을 눈으로 보기 위한 최소 설정.
#
# k6 부하는 Prometheus remote write로 들어온다(compose의 --web.enable-remote-write-receiver).
# 운영 스크레이프 대상은 docker-compose.prod.yml + prometheus.prod.yml 쪽이다.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aewol-backend
    metrics_path: /api/metrics
    # 메트릭은 JWT가 아니라 전용 토큰으로 지킨다. Prometheus는 토큰을 갱신할 수 없어
    # 만료되는 JWT로는 스크레이핑을 이어갈 수 없다.
    # METRICS_TOKEN과 같은 값을 넣는다. 아래 값은 로컬 전용이며 스테이징·운영에서
    # 절대 복사하거나 재사용하지 않는다.
    http_headers:
      X-Metrics-Token:
        values: ["local-scrape-secret"]
    static_configs:
      # 앱은 컨테이너 밖(호스트)에서 도는 경우가 많아 host.docker.internal로 잡는다.
      - targets: ["host.docker.internal:8080"]
