spring:
  # MySQL (개발 서버용 — 실제 값은 환경변수로 주입)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/aewol?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:aewol}
    password: ${DB_PASSWORD:aewol1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Mail
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Batch
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

# JWT
jwt:
  secret: ${JWT_SECRET:aewol-dev-secret-key-for-jwt-token-generation-minimum-256-bits-required}
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000

# External APIs
external:
  solapi:
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender: ${SOLAPI_SENDER:}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/callback/kakao}
  ocr-service:
    url: ${OCR_SERVICE_URL:http://localhost:8000}
  toss:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    # 홈 인사이트 카드 문구 생성용. 2문장짜리 짧은 작업이라 추론 모델(gpt-5-*)은
    # 품질 차이 없이 토큰만 10배 든다(실측 152 vs 1,514).
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    max-tokens: ${OPENAI_MAX_TOKENS:200}
  codef:
    client-id: ${CODEF_CLIENT_ID:}
    client-secret: ${CODEF_CLIENT_SECRET:}
    # 정식 계약 후엔 CODEF_API_BASE_URL=https://api.codef.io 로 교체
    oauth-url: ${CODEF_OAUTH_URL:https://oauth.codef.io/oauth/token}
    api-base-url: ${CODEF_API_BASE_URL:https://development.codef.io}
  apms:
    service-key: ${APMS_SERVICE_KEY:}
    base-url: ${APMS_BASE_URL:https://apis.data.go.kr/1543061/animalInfoSrvc_v3/animalInfo_v3}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
  gov24:
    service-key: ${GOV24_SERVICE_KEY:}
  apms:
    service-key: ${APMS_SERVICE_KEY:}
  animal-hospital:
    service-key: ${ANIMAL_HOSPITAL_SERVICE_KEY:}

# File
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

# Logging
logging:
  level:
    com.aewol: DEBUG
