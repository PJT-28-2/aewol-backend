# 운영 프로파일. 모든 값은 환경변수로 주입한다.
#
# 시크릿에는 기본값을 두지 않는다. application-dev.yml의 ACCOUNT_ENCRYPTION_KEY와 같은
# 원칙으로, 환경변수를 빠뜨렸을 때 커밋된 값으로 조용히 기동되는 것보다 즉시 기동에
# 실패하는 편이 안전하다. 주소·모델명처럼 노출되어도 무해한 값에만 기본값을 둔다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

# CORS
# 로컬·개발 프로파일은 localhost를 기본값으로 두지만 운영은 반드시 실제 도메인을 넣는다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:1800000}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000}

# 계좌번호 암호화
security:
  account:
    encryption-key: ${ACCOUNT_ENCRYPTION_KEY}
    hash-key: ${ACCOUNT_HASH_KEY}

# 홈 AI 인사이트 카드
insight:
  ttl-hours: ${INSIGHT_TTL_HOURS:24}
  enabled: ${INSIGHT_ENABLED:true}

swagger:
  enabled: false

donation:
  allow-demo-donations: false

cookie:
  secure: true

# 시연용 설정(#290)
demo:
  # 1원 인증 입금자명을 verify-deposit 응답에 실어 보낼지 여부. 실제 입금 확인 없이
  # 인증을 통과시킬 수 있게 되므로 기본값은 false이며, 시연용 배포에서만 true로 켠다.
  # true로 켜더라도 CODEF 데모 서버에 붙어 있을 때만 동작한다
  # (AccountServiceImpl.isTestExposureAllowed) — 정식 서버로 전환하면 이 값을
  # 끄지 않아도 자동으로 차단된다.
  expose-depositor-name: ${DEMO_EXPOSE_DEPOSITOR_NAME:false}

wallet:
  allow-unverified-deposit: false

# External APIs
external:
  solapi:
    # 빈 기본값을 두면 SMS 요청 시점에만 503이 나고 기동은 성공한다.
    api-key: ${SOLAPI_API_KEY}
    api-secret: ${SOLAPI_API_SECRET}
    sender: ${SOLAPI_SENDER}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  ocr-service:
    url: ${OCR_SERVICE_URL:http://ocr-service:8000}
  toss:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    max-tokens: ${OPENAI_MAX_TOKENS:200}
  codef:
    client-id: ${CODEF_CLIENT_ID:}
    client-secret: ${CODEF_CLIENT_SECRET:}
    oauth-url: ${CODEF_OAUTH_URL:https://oauth.codef.io/oauth/token}
    api-base-url: ${CODEF_API_BASE_URL:https://development.codef.io}
  apms:
    service-key: ${APMS_SERVICE_KEY:}
    base-url: ${APMS_BASE_URL:https://apis.data.go.kr/1543061/animalInfoSrvc_v3/animalInfo_v3}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
  gov24:
    service-key: ${GOV24_SERVICE_KEY:}
  animal-hospital:
    service-key: ${ANIMAL_HOSPITAL_SERVICE_KEY:}

# File
file:
  # 업로드 파일은 S3에 저장한다(#198). 버킷 이름은 필수다.
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}
    # 멍스타그램 공개 사진 서빙.
    #
    # 공개로 전환한 일기 사진만 이 prefix로 복사되고 CDN이 그대로 서빙한다. 비공개
    # 사진은 지금처럼 만료되는 서명 URL로만 나간다.
    #
    # 값이 비면 공개 사본을 만들지 않고, 멍스타그램은 원본의 서명 URL로 보여 준다.
    # 만료 없는 CDN 주소를 쓰려면 CloudFront 등에서 이 prefix만 연 뒤
    # S3_PUBLIC_BASE_URL을 넣는다. 버킷 전체를 열면 비공개 일기 사진까지 노출된다.
    # 기동 로그에 [PUBLIC_SERVING_DISABLED]가 찍힌다.
    public-prefix: ${S3_PUBLIC_PREFIX:public}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
  # FileUtil(레거시 경로)이 아직 로컬 디스크를 쓴다. 통합 전까지 유지한다.
  upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}

# Logging
logging:
  level:
    com.aewol: ${LOG_LEVEL:INFO}
