# 운영 프로파일. 모든 값은 환경변수로 주입한다.
#
# 시크릿에는 기본값을 두지 않는다. application-dev.yml의 ACCOUNT_ENCRYPTION_KEY와 같은
# 원칙으로, 환경변수를 빠뜨렸을 때 커밋된 값으로 조용히 기동되는 것보다 즉시 기동에
# 실패하는 편이 안전하다. 주소·모델명처럼 노출되어도 무해한 값에만 기본값을 둔다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

# CORS
# 로컬·개발 프로파일은 localhost를 기본값으로 두지만 운영은 반드시 실제 도메인을 넣는다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:1800000}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000}

# 계좌번호 암호화
security:
  account:
    encryption-key: ${ACCOUNT_ENCRYPTION_KEY}
    hash-key: ${ACCOUNT_HASH_KEY}

# 홈 AI 인사이트 카드
insight:
  ttl-hours: ${INSIGHT_TTL_HOURS:24}
  enabled: ${INSIGHT_ENABLED:true}

# External APIs
external:
  solapi:
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender: ${SOLAPI_SENDER:}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  ocr-service:
    url: ${OCR_SERVICE_URL:http://ocr-service:8000}
  toss:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    max-tokens: ${OPENAI_MAX_TOKENS:200}
  codef:
    client-id: ${CODEF_CLIENT_ID:}
    client-secret: ${CODEF_CLIENT_SECRET:}
    oauth-url: ${CODEF_OAUTH_URL:https://oauth.codef.io/oauth/token}
    api-base-url: ${CODEF_API_BASE_URL:https://development.codef.io}
  apms:
    service-key: ${APMS_SERVICE_KEY:}
    base-url: ${APMS_BASE_URL:https://apis.data.go.kr/1543061/animalInfoSrvc_v3/animalInfo_v3}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
  gov24:
    service-key: ${GOV24_SERVICE_KEY:}
  animal-hospital:
    service-key: ${ANIMAL_HOSPITAL_SERVICE_KEY:}

# File
# S3 전환(#198) 전까지는 컨테이너 볼륨 경로를 사용한다.
file:
  upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}

# Logging
logging:
  level:
    com.aewol: ${LOG_LEVEL:INFO}
