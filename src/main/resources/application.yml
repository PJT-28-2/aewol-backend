spring:
  application:
    name: aewol-backend

  profiles:
    active: local

  # Jackson
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd HH:mm:ss

  # Servlet
  servlet:
    multipart:
      max-file-size: 10MB
      # 1:1 문의 첨부파일이 파일당 10MB, 최대 3개까지 허용되어(api_명세서.md) 전체 요청
      # 크기가 10MB를 넘을 수 있다 — max-file-size(파일 1개당 제한)와 별개로
      # max-request-size(요청 전체 제한)도 3개분 + 여유를 두고 올린다(2026-08-08).
      max-request-size: 35MB

# Server
server:
  port: 8080
  servlet:
    context-path: /

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.aewol.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# 홈 AI 인사이트 카드
insight:
  # 회원·카드 종류별 캐시 유효시간. 배치가 매일 새벽에 미리 채우므로
  # 실사용에서는 대부분 캐시 적중이다.
  ttl-hours: ${INSIGHT_TTL_HOURS:24}
  # false로 두면 카드 API가 빈 배열을 돌려주고 외부 호출도 하지 않는다.
  enabled: ${INSIGHT_ENABLED:true}

swagger:
  enabled: ${SWAGGER_ENABLED:true}

donation:
  show-demo-campaigns: ${DONATION_SHOW_DEMO_CAMPAIGNS:true}

cookie:
  secure: ${COOKIE_SECURE:false}

# Toss 없이 MAIN 지갑을 올리는 POST /api/wallet/deposit. 운영 기본값은 차단이다.
wallet:
  allow-unverified-deposit: ${WALLET_ALLOW_UNVERIFIED_DEPOSIT:false}
