spring:
  application:
    name: aewol-backend

  profiles:
    active: local

  # Jackson
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd HH:mm:ss

  # Servlet
  servlet:
    multipart:
      max-file-size: 10MB
      # 1:1 문의 첨부파일이 파일당 10MB, 최대 3개까지 허용되어(api_명세서.md) 전체 요청
      # 크기가 10MB를 넘을 수 있다 — max-file-size(파일 1개당 제한)와 별개로
      # max-request-size(요청 전체 제한)도 3개분 + 여유를 두고 올린다(2026-08-08).
      max-request-size: 35MB

# Server
server:
  port: 8080
  servlet:
    context-path: /

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.aewol.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
