spring:
  application:
    name: aewol-backend

  profiles:
    active: local

  # Jackson
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd HH:mm:ss

  # Servlet
  servlet:
    multipart:
      max-file-size: 10MB
      # 1:1 문의 첨부파일이 파일당 10MB, 최대 3개까지 허용되어(api_명세서.md) 전체 요청
      # 크기가 10MB를 넘을 수 있다 — max-file-size(파일 1개당 제한)와 별개로
      # max-request-size(요청 전체 제한)도 3개분 + 여유를 두고 올린다(2026-08-08).
      max-request-size: 35MB

# Server
server:
  port: 8080
  servlet:
    context-path: /

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.aewol.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# 홈 AI 인사이트 카드
insight:
  # 회원·카드 종류별 캐시 유효시간. 배치가 매일 새벽에 미리 채우므로
  # 실사용에서는 대부분 캐시 적중이다.
  ttl-hours: ${INSIGHT_TTL_HOURS:24}
  # false로 두면 카드 API가 빈 배열을 돌려주고 외부 호출도 하지 않는다.
  enabled: ${INSIGHT_ENABLED:true}

swagger:
  enabled: ${SWAGGER_ENABLED:true}

# 시드 캠페인은 [시연] 접두어와 허수 모금액이 있다. 목록에는 항상 보여 주고,
# 실제 기부·자동기부는 이 플래그가 true일 때만 허용한다(운영 기본값 false).
donation:
  allow-demo-donations: ${DONATION_ALLOW_DEMO_DONATIONS:true}

cookie:
  secure: ${COOKIE_SECURE:false}

# Toss 없이 MAIN 지갑을 올리는 POST /api/wallet/deposit. 운영 기본값은 차단이다.
wallet:
  allow-unverified-deposit: ${WALLET_ALLOW_UNVERIFIED_DEPOSIT:false}

# 메트릭 스크레이핑 토큰. 없으면 /api/metrics는 404가 된다.
# Prometheus는 JWT를 갱신할 수 없어 만료되는 토큰으로는 스크레이핑을 이어갈 수 없다.
metrics:
  token: ${METRICS_TOKEN:}
