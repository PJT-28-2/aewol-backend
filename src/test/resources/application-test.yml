spring:
  datasource:
    url: jdbc:h2:mem:aewol;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: localhost
      port: 6379

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

jwt:
  secret: aewol-test-secret-key-for-jwt-token-generation-minimum-256-bits-required
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000

logging:
  level:
    com.aewol: DEBUG
